<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Manager - Login</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/main.js" defer></script>
</head>
<body>
  <div class="glass-container auth-box">
    <h1>Mail Manager</h1>
    <p class="subtitle">Access your automated email sorting system</p>
    
    <div id="login-section">
      <button id="login-btn" class="btn primary-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        Sign in with Passkey
      </button>
      <div id="login-error" class="error-text"></div>
    </div>
    
    <div id="setup-section" style="display: none;">
      <p>Setup mode activated.</p>
      <button id="setup-btn" class="btn primary-btn">Register new Passkey</button>
      <div id="setup-error" class="error-text"></div>
    </div>
  </div>
</body>
</html>
